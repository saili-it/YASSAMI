
# ===================== YASSAMI (yassami.ma) — DÉBUT ÉTAPE 2 =====================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yassami.ma www.yassami.ma;

    ssl_certificate     /etc/letsencrypt/live/yassami.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yassami.ma/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YASSAMI_SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64M;

    # www → domaine principal
    if ($host = www.yassami.ma) {
        return 301 https://yassami.ma$request_uri;
    }

    # Résolution au moment de la requête (DNS interne Docker).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $yassami_upstream http://yassami-web:80;

    location / {
        proxy_pass $yassami_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
    }
}
# ===================== YASSAMI (yassami.ma) — FIN ÉTAPE 2 =======================
