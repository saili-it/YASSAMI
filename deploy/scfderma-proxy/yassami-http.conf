
# ===================== YASSAMI (yassami.ma) — DÉBUT ÉTAPE 1 =====================
# Ajouté pour héberger yassami.ma derrière ce Nginx. N'affecte pas les autres sites.
# Le conteneur YASSAMI est joint par son nom au moment de la requête (resolver Docker) :
# si YASSAMI est arrêté, seul yassami.ma répond 502, ce Nginx démarre et recharge normalement.
server {
    listen 80;
    listen [::]:80;
    server_name yassami.ma www.yassami.ma;

    # Validation Let's Encrypt (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://yassami.ma$request_uri;
    }
}
# ===================== YASSAMI (yassami.ma) — FIN ÉTAPE 1 =======================
