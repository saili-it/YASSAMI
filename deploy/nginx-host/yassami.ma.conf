# YASSAMI — vhost pour un Nginx DÉJÀ installé sur le serveur (option B de DEPLOY.md).
# Copier dans /etc/nginx/sites-available/yassami.ma puis activer, et lancer certbot.
# Le site tourne dans Docker et écoute sur 127.0.0.1:8020 (HTTP_PORT dans .env).

server {
    listen 80;
    listen [::]:80;
    server_name yassami.ma www.yassami.ma;

    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
# Certbot ajoutera automatiquement le bloc HTTPS (443) et la redirection HTTP → HTTPS.
