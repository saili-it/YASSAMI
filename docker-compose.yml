name: yassami

# Environnement de développement local.
#   docker compose up -d                 → app + nginx + mysql
#   docker compose --profile dev up -d   → + serveur Vite (HMR)

services:
  # ---------------------------------------------------------------- PHP-FPM --
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: yassami/app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      # Sur Windows, le bind mount est très lent pour les ~10 000 fichiers de
      # vendor/ et les caches : on les sort dans des volumes nommés.
      - vendor:/var/www/html/vendor
      - framework-cache:/var/www/html/storage/framework
      - bootstrap-cache:/var/www/html/bootstrap/cache
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-app.ini:ro
    # Volontairement AUCUNE variable Laravel (APP_*, DB_*) ici : elles vivent
    # dans .env. Injectées par Docker, elles écraseraient phpunit.xml et les
    # tests (RefreshDatabase) videraient la base de développement.
    environment:
      APP_PORT: "${APP_PORT:-8020}"
      WAIT_FOR_DB_HOST: mysql
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "${RUN_SEEDERS:-false}"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [yassami]

  # ------------------------------------------------------------------ Nginx --
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8020}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [yassami]

  # ------------------------------------------------------------------ MySQL --
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT_HOST:-3310}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-yassami}"
      MYSQL_USER: "${DB_USERNAME:-yassami}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-yassami}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [yassami]

  # ---------------------------------------------- Vite (assets, profil dev) --
  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    profiles: [dev]
    ports:
      - "${VITE_PORT:-5180}:5180"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      DOCKER: "true"
    command: sh -c "[ -f node_modules/.package-lock.json ] || npm install; npm run dev -- --host 0.0.0.0"
    networks: [yassami]

volumes:
  mysql-data:
  vendor:
  framework-cache:
  bootstrap-cache:
  node-modules:

networks:
  yassami:
    driver: bridge
