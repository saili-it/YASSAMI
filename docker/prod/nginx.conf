# YASSAMI — Nginx du conteneur « web » (production).
# Il ne gère PAS le HTTPS : il est derrière le proxy HTTPS (Caddy ou Nginx de l'hôte).
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 64M;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Assets compilés par Vite : noms versionnés, cache long.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Photos produits et images du site.
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Les photos téléversées ne doivent jamais être exécutées.
    location ^~ /storage/ {
        location ~ \.php$ { deny all; }
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        # Alias unique (et non « app ») : sur un serveur partagé, « web » peut aussi être
        # branché au réseau d'un autre projet qui a lui-même un service « app ».
        fastcgi_pass yassami-app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Aucun autre fichier PHP n'est exécutable.
    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known).* { deny all; }
}
